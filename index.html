<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff7f1">
  <title>Happy Birthday, Mom!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#514237;--peach:#fff0e8;--cream:#fffaf6;--coral:#e98f7f;--pink:#efa1af;--sage:#78937d;--gold:#e7bc76;--safe-bottom:env(safe-area-inset-bottom,0px)}
    *{box-sizing:border-box}body{margin:0;background:var(--peach);color:var(--ink);font-family:"DM Sans",sans-serif}.page{position:relative;max-width:560px;min-height:100svh;margin:auto;overflow:hidden;background:linear-gradient(180deg,#fff9f5,#fff0e8)}
    .love-background{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}.telugu-love{position:absolute;white-space:nowrap;color:var(--coral);font:600 1.12rem "Playfair Display",serif;opacity:.1;animation:love-drift var(--time) ease-in-out var(--delay) infinite alternate}.telugu-love:nth-child(1){top:8%;left:-12%;--time:6s;--delay:-2s}.telugu-love:nth-child(2){top:28%;right:-20%;--time:7s;--delay:-5s}.telugu-love:nth-child(3){top:54%;left:-20%;--time:6.5s;--delay:-4s}.telugu-love:nth-child(4){top:76%;right:-14%;--time:8s;--delay:-6s}.telugu-love:nth-child(5){top:91%;left:-15%;--time:7s;--delay:-1s}@keyframes love-drift{to{transform:translate(32px,-13px) rotate(3deg);opacity:.18}}
    .page>header,.page>.bouquet-wrap,.page>section{position:relative;z-index:1}
    header{text-align:center;padding:52px 24px 20px}.tag{margin:0;color:var(--coral);font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.title{margin:10px 0 11px;font:700 clamp(2.6rem,12vw,4.25rem)/.96 "Playfair Display",serif}.title em{color:var(--coral);font-style:italic}.subtitle{max-width:300px;margin:auto;color:#766458;font-size:.95rem;line-height:1.55}
    .bouquet-wrap{position:relative;height:300px;margin:6px auto 15px;width:310px;animation:bouquet-breathe 5s ease-in-out infinite}.ground{position:absolute;bottom:17px;left:30px;right:30px;height:18px;border-radius:50%;background:rgba(169,114,89,.12);filter:blur(5px)}.stem{position:absolute;bottom:33px;left:50%;width:6px;height:158px;border-radius:9px;background:linear-gradient(90deg,#5d7e65,#a6b98c);transform-origin:bottom;transform:rotate(var(--angle))}.stem::after{content:"";position:absolute;top:62px;width:30px;height:15px;border-radius:100% 0 100% 0;background:#88a77d;transform:rotate(36deg)}.stem:nth-child(odd)::after{left:-25px;transform:scaleX(-1) rotate(36deg)}
    .flower{--flower:#efa1af;position:absolute;left:50%;bottom:168px;width:55px;height:55px;transform:translateX(-50%) translateX(var(--x)) translateY(var(--y));animation:flower-sway var(--duration) ease-in-out var(--delay) infinite alternate}.petal{position:absolute;left:18px;top:2px;width:20px;height:31px;border-radius:50% 50% 48% 48%;background:var(--flower);transform-origin:10px 25px;box-shadow:inset -3px -4px 7px rgba(180,72,90,.13)}.petal:nth-child(1){transform:rotate(0)}.petal:nth-child(2){transform:rotate(72deg)}.petal:nth-child(3){transform:rotate(144deg)}.petal:nth-child(4){transform:rotate(216deg)}.petal:nth-child(5){transform:rotate(288deg)}.center{position:absolute;z-index:2;left:21px;top:21px;width:14px;height:14px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px rgba(255,239,187,.4)}.daisy{--flower:#fff7e5}.daisy .petal{width:15px;height:28px;left:20px;background:#fffdf6}.daisy .center{background:#eabf62}.tulip{width:48px;height:47px;bottom:158px}.tulip .petal{top:7px;left:13px;width:25px;height:31px;border-radius:55% 55% 40% 40%;transform-origin:12px 38px}.tulip .petal:nth-child(2){transform:rotate(34deg)}.tulip .petal:nth-child(3){transform:rotate(-34deg)}.tulip .petal:nth-child(n+4),.tulip .center{display:none}
    .ribbon{position:absolute;z-index:3;left:calc(50% - 31px);bottom:35px;width:62px;height:44px;background:var(--coral);clip-path:polygon(0 0,50% 23%,100% 0,77% 50%,100% 100%,50% 77%,0 100%,23% 50%);filter:drop-shadow(0 4px 2px rgba(154,81,69,.15))}.ribbon::after{content:"";position:absolute;inset:15px 24px;background:#ffe1d7;border-radius:50%}
    .spark{position:absolute;color:var(--gold);font-size:1.15rem;animation:twinkle 2.8s ease-in-out infinite}.spark.a{top:35px;left:27px}.spark.b{top:83px;right:25px;animation-delay:1.2s}.spark.c{top:184px;left:10px;animation-delay:.6s}.petal-fall{position:absolute;z-index:2;color:var(--pink);font-size:1.15rem;opacity:0;animation:petal-fall var(--fall-time) linear var(--fall-delay) infinite}.petal-fall.one{left:16%;top:18%;--fall-time:8s;--fall-delay:-3s}.petal-fall.two{right:17%;top:6%;--fall-time:9.5s;--fall-delay:-6s}.petal-fall.three{left:8%;top:53%;--fall-time:10s;--fall-delay:-1s}@keyframes bouquet-breathe{50%{transform:translateY(-5px)}}@keyframes flower-sway{to{transform:translateX(-50%) translateX(calc(var(--x) + 5px)) translateY(var(--y)) rotate(3deg)}}@keyframes twinkle{50%{transform:scale(1.45) rotate(20deg);opacity:.4}}@keyframes petal-fall{0%{transform:translate(0,0) rotate(0);opacity:0}12%{opacity:.75}90%{opacity:.6}100%{transform:translate(48px,245px) rotate(260deg);opacity:0}}
    .message{margin:0 20px;padding:25px 24px;border-radius:22px;background:rgba(255,255,255,.67);box-shadow:0 12px 31px -25px rgba(113,64,45,.65);text-align:center}.message h2{margin:0 0 11px;font:600 1.6rem "Playfair Display",serif}.message p{margin:0;color:#735f53;font-size:.95rem;line-height:1.63}
    .photos{padding:33px 20px calc(40px + var(--safe-bottom))}.photos h2{text-align:center;margin:0 0 18px;font:600 1.55rem "Playfair Display",serif}.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.photo{aspect-ratio:1;border:5px solid #fffdf9;border-radius:12px;background:linear-gradient(135deg,#f5cbd1,#ffe5bb);overflow:hidden;box-shadow:0 8px 15px -12px rgba(95,57,43,.55);transform:rotate(var(--rotate))}.photo:nth-child(2){--rotate:2.2deg}.photo:nth-child(3){--rotate:-2deg}.photo img{width:100%;height:100%;object-fit:cover;display:block}.empty{display:grid;place-items:center;height:100%;color:rgba(116,81,71,.55);font-size:1.35rem}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
  </style>
</head>
<body>
  <main class="page">
    <div class="love-background" aria-hidden="true"><span class="telugu-love">నిన్ను ప్రేమిస్తున్నాను అమ్మా</span><span class="telugu-love">నిన్ను ప్రేమిస్తున్నాను అమ్మా</span><span class="telugu-love">నిన్ను ప్రేమిస్తున్నాను అమ్మా</span><span class="telugu-love">నిన్ను ప్రేమిస్తున్నాను అమ్మా</span><span class="telugu-love">నిన్ను ప్రేమిస్తున్నాను అమ్మా</span></div>
    <header><p class="tag">for the best mom</p><h1 class="title">Happy birthday<br><em>Ma!</em></h1><p class="subtitle">Love you so much</p></header>
    <div class="bouquet-wrap" aria-label="A gently swaying bouquet of flowers">
      <span class="spark a">✦</span><span class="spark b">✦</span><span class="spark c">·</span><span class="petal-fall one">✿</span><span class="petal-fall two">✿</span><span class="petal-fall three">✿</span><div class="ground"></div>
      <i class="stem" style="--angle:-25deg"></i><i class="stem" style="--angle:-12deg"></i><i class="stem" style="--angle:0deg"></i><i class="stem" style="--angle:12deg"></i><i class="stem" style="--angle:25deg"></i>
      <div class="flower" style="--x:-74px;--y:22px;--duration:3.2s;--delay:-.4s"><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="center"></i></div>
      <div class="flower daisy" style="--x:-38px;--y:-13px;--duration:3.9s;--delay:-1s"><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="center"></i></div>
      <div class="flower tulip" style="--flower:#e98f7f;--x:3px;--y:-39px;--duration:3.4s;--delay:-.7s"><i class="petal"></i><i class="petal"></i><i class="petal"></i></div>
      <div class="flower daisy" style="--x:41px;--y:-5px;--duration:4.2s;--delay:-1.5s"><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="center"></i></div>
      <div class="flower tulip" style="--flower:#efa1af;--x:76px;--y:26px;--duration:3.1s;--delay:-.2s"><i class="petal"></i><i class="petal"></i><i class="petal"></i></div><div class="ribbon"></div>
    </div>
    <section class="photos"><h2></h2><div class="photo-grid" id="photoGrid"></div></section>
  </main>
  <script>
    // The three photos live beside index.html in this GitHub Pages folder.
    const photos=["pic1.jpeg","pic2.jpeg","pic3.jpeg"];
    const grid=document.querySelector("#photoGrid");
    photos.forEach((src,index)=>{const card=document.createElement("div");card.className="photo";const image=new Image();image.src=src;image.alt=`Favourite memory ${index+1}`;image.onload=()=>card.append(image);image.onerror=()=>card.innerHTML='<div class="empty">♡</div>';card.append(image);grid.append(card)});
  </script>
</body>
</html>
